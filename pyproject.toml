[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awsmig"
version = "0.1.0"
description = "Data migration into AWS from databases, GIS files, file shares, SFTP and Esri services, with row-level verification"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34", "pyarrow>=15", "pyogrio>=0.9", "shapely>=2.0", "pyproj>=3.6", "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1", "paramiko>=3.4", "requests>=2.31", "pyyaml>=6.0",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5"]
oracle = ["oracledb>=2"]
mysql = ["pymysql>=1.1"]
dev = ["pytest>=8", "ruff>=0.4", "moto[server]>=5", "geopandas>=0.14"]

[project.scripts]
awsmig = "awsmig.cli:main"

[tool.setuptools]
packages = ["awsmig", "awsmig.sources", "awsmig.targets"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B905"]
